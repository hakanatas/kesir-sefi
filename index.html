<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kesir Pizza Şefi (Fraction Pizza Chef)</title>
    <!-- Favicon 404 hatasını önlemek için boş ikon -->
    <link rel="icon" href="data:,">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- p5.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>

    <!-- ml5.js Library (Latest version) -->
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2c3e50;
            /* A nice dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            /* Mobile viewport fix */
            width: 100vw;
            width: 100dvw;
            font-family: 'Nunito', sans-serif;
            /* Playful font for kids */
            touch-action: none;
            /* Prevent browser zoom/scroll */
            user-select: none;
            /* Prevent text selection */
            -webkit-user-select: none;
        }

        canvas {
            border: 5px solid #ecf0f1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        #loading {
            position: absolute;
            color: white;
            font-size: 24px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }

        /* Custom loading screen styling */
        #p5_loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            z-index: 10000;
        }

        #p5_loading h2 {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        /* Force hide the DOM video element created by p5.js */
        video {
            display: none !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
            position: absolute;
            z-index: -100;
        }

        #footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-family: 'Nunito', sans-serif;
            pointer-events: none;
            /* Let clicks pass through */
            z-index: 1000;
        }

        /* ... existing styles ... */
        /* Removed instruction overlay styles for auto-start */
    </style>
</head>

<body>
    <!-- Custom p5 loading screen to prevent white flash -->
    <div id="p5_loading">
        <h2 style="color:white; font-family:'Nunito', sans-serif;">Yükleniyor... (Kamera ve Yapay Zeka Hazırlanıyor)
        </h2>
    </div>

    <!-- Hataları ekranda göstermek için -->
    <script>
        window.addEventListener('error', function(e) {
            let errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position:absolute; top:10px; left:10px; z-index:9999; background:white; color:red; padding:15px; font-weight:bold; max-width:90vw;';
            errorDiv.innerHTML = 'HATA: ' + e.message + '<br>Satır: ' + e.lineno;
            document.body.appendChild(errorDiv);
        });
        window.addEventListener('unhandledrejection', function(e) {
            let errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position:absolute; top:10px; left:10px; z-index:9999; background:white; color:red; padding:15px; font-weight:bold; max-width:90vw;';
            errorDiv.innerHTML = 'HATA (Promise): ' + e.reason;
            document.body.appendChild(errorDiv);
        });
    </script>

    <!-- Auto-starting version, overlay removed -->
    <div id="footer">Bu oyun FTC #24230 takımı tarafından YZ kullanarak yapılmıştır.</div>
    <script src="sketch.js?v=4.1"></script>
</body>

</html>
